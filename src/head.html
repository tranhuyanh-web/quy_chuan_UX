<title>Chuẩn UX Form Đăng ký</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Bộ tiêu chuẩn UX cho form đăng ký cuộc thi, hồ sơ, sự kiện: nguyên tắc có demo chạy thật, form mẫu, thư viện trường, câu chữ tiếng Việt và checklist đánh giá.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: thanh trên dính + cột điều hướng trái (≥1080px) / dải tab cuộn ngang (điện thoại); nội dung một cột ≤ 1120px.
   Motif: "bút duyệt bài" — huy hiệu vàng dạ quang đánh dấu nguyên tắc ngay trên giao diện form chạy thật. */
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --surface-2:#ECEEF3; --sunken:#E7EAF0;
  --ink:#131720; --ink-2:#2D3340; --muted:#566074; --line:#D9DDE5; --line-strong:#7D8696;
  --accent:#2944D6; --accent-hover:#1F36B5; --accent-ink:#FFFFFF; --accent-soft:#E6EAFC; --ring:#A9B5F2;
  --mark:#FFE15C; --mark-ink:#2E2500; --mark-soft:#FFF5C4;
  --ok:#16774A; --ok-soft:#E2F3E9; --err:#C22929; --err-soft:#FBE8E8; --warn:#8F5600; --warn-soft:#FFF1D6;
  --field:#FFFFFF; --scrim:rgb(19 23 32 / .45);
  --shadow-1:0 1px 2px rgb(17 24 39 / .06);
  --shadow-2:0 2px 6px rgb(17 24 39 / .06), 0 14px 36px rgb(17 24 39 / .10);
  --f-display:"Bricolage Grotesque","Be Vietnam Pro",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --hdr:58px; --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1116; --surface:#161A21; --surface-2:#1D222B; --sunken:#12161C;
  --ink:#E8EBF1; --ink-2:#C8CEDA; --muted:#9AA3B5; --line:#2A303B; --line-strong:#6C7587;
  --accent:#8C9FFF; --accent-hover:#A9B7FF; --accent-ink:#0E1116; --accent-soft:#1D2547; --ring:#3E4C99;
  --mark:#F0CB45; --mark-ink:#231B00; --mark-soft:#38300F;
  --ok:#5ED197; --ok-soft:#11291C; --err:#FF8B8B; --err-soft:#361A1C; --warn:#F2B650; --warn-soft:#33270F;
  --field:#0F1318; --scrim:rgb(0 0 0 / .6);
  --shadow-1:0 1px 2px rgb(0 0 0 / .4); --shadow-2:0 2px 6px rgb(0 0 0 / .4), 0 14px 36px rgb(0 0 0 / .5);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1116; --surface:#161A21; --surface-2:#1D222B; --sunken:#12161C;
  --ink:#E8EBF1; --ink-2:#C8CEDA; --muted:#9AA3B5; --line:#2A303B; --line-strong:#6C7587;
  --accent:#8C9FFF; --accent-hover:#A9B7FF; --accent-ink:#0E1116; --accent-soft:#1D2547; --ring:#3E4C99;
  --mark:#F0CB45; --mark-ink:#231B00; --mark-soft:#38300F;
  --ok:#5ED197; --ok-soft:#11291C; --err:#FF8B8B; --err-soft:#361A1C; --warn:#F2B650; --warn-soft:#33270F;
  --field:#0F1318; --scrim:rgb(0 0 0 / .6);
  --shadow-1:0 1px 2px rgb(0 0 0 / .4); --shadow-2:0 2px 6px rgb(0 0 0 / .4), 0 14px 36px rgb(0 0 0 / .5);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--hdr) + 24px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.6 var(--f-body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
body.no-scroll{overflow:hidden}
h1,h2,h3,h4{margin:0;line-height:1.25;text-wrap:balance;color:var(--ink)}
p{margin:0}
a{color:var(--accent);text-underline-offset:2px}
a:hover{color:var(--accent-hover)}
code{font-family:var(--f-mono);font-size:.86em;background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:.08em .35em;overflow-wrap:anywhere}
kbd{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:var(--surface);color:var(--muted)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.vh{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.muted{color:var(--muted)}
.ic{flex:none;display:inline-block;vertical-align:middle}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

/* ---------- Thanh trên ---------- */
.skip{position:absolute;left:12px;top:-60px;z-index:100;background:var(--accent);color:var(--accent-ink);padding:10px 14px;border-radius:8px;font-weight:600}
.skip:focus{top:calc(env(safe-area-inset-top,0px) + 8px)}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar{height:var(--hdr);display:flex;align-items:center;gap:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;min-width:0}
.brand:hover{color:var(--ink)}
.brand-mark{width:34px;height:34px;flex:none}
.brand-name{font:700 15px/1.15 var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-name b{font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:-.01em;display:block}
.brand-name small{display:block;font-weight:500;font-size:11.5px;color:var(--muted);letter-spacing:.02em}
.search-btn{margin-left:auto;display:flex;align-items:center;gap:10px;height:40px;min-width:0;width:min(360px,40vw);padding:0 10px 0 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--muted);cursor:pointer;text-align:left}
.search-btn span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.search-btn:hover{border-color:var(--line-strong);color:var(--ink)}
.icon-btn{width:40px;height:40px;display:inline-grid;place-items:center;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--ink-2);cursor:pointer;flex:none}
.icon-btn:hover{background:var(--surface-2)}
.tabstrip{position:relative;display:none;gap:4px;overflow-x:auto;scrollbar-width:none;padding:0 max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px))}
.tabstrip::-webkit-scrollbar{display:none}
.tabstrip a{flex:none;display:flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:999px;color:var(--ink-2);text-decoration:none;font-weight:600;font-size:14px;white-space:nowrap}
.tabstrip a[aria-current="page"]{background:var(--ink);color:var(--surface)}

/* ---------- Khung ---------- */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:calc(100vh - var(--hdr))}
.sidenav{position:sticky;top:calc(var(--hdr) + env(safe-area-inset-top,0px));align-self:start;height:calc(100vh - var(--hdr) - env(safe-area-inset-top,0px));overflow:auto;padding:20px 14px 24px max(14px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);display:flex;flex-direction:column;gap:18px}
.nav-list{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.nav-list a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;color:var(--ink-2);text-decoration:none;font-weight:500}
.nav-list a:hover{background:var(--surface-2);color:var(--ink)}
.nav-list a[aria-current="page"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:var(--shadow-1),inset 0 0 0 1px var(--line)}
.nav-list a[aria-current="page"] .ic{color:var(--accent)}
.nav-count{margin-left:auto;font:600 12px var(--f-mono);color:var(--muted)}
.nav-label{font:700 11px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 10px 8px}
.nav-audit{display:block;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-decoration:none;color:var(--ink)}
.nav-audit:hover{border-color:var(--line-strong);color:var(--ink)}
.nav-audit-t{font-weight:700;font-size:13.5px;display:flex;justify-content:space-between;gap:8px}
.nav-audit-s{font-size:12.5px;color:var(--muted);margin-top:2px}
.meter{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:10px;display:flex}
.meter i{display:block;height:100%}
.meter .m-ok{background:var(--ok)} .meter .m-err{background:var(--err)} .meter .m-na{background:var(--line-strong)}
main{min-width:0;outline:none}
.view{max-width:1120px;margin:0 auto;padding-block:32px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:viewIn .22s ease-out}
@media (min-width:1080px){.view{padding-left:40px;padding-right:max(40px,env(safe-area-inset-right,0px))}}
@keyframes viewIn{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (max-width:1079px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .sidenav{display:none}
  .tabstrip{display:flex}
  .search-btn{width:auto;flex:0 1 220px}
}
@media (max-width:560px){
  .search-btn span,.search-btn kbd{display:none}
  .search-btn{flex:none;width:40px;padding:0;justify-content:center;border-color:transparent;background:transparent}
  .brand-name small{display:none}
}

/* ---------- Kiểu chữ ---------- */
.eyebrow{font:700 12px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.display{font-family:var(--f-display);font-weight:800;font-size:clamp(32px,4.6vw,52px);line-height:1.06;letter-spacing:-.025em}
.h1{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,3.4vw,40px);letter-spacing:-.02em;line-height:1.1}
.h2{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,2.4vw,28px);letter-spacing:-.015em}
.h3{font-weight:700;font-size:17px}
.lead{font-size:17px;line-height:1.6;color:var(--ink-2);max-width:68ch}
.hl{background:linear-gradient(transparent 58%,var(--mark) 58%,var(--mark) 92%,transparent 92%);padding:0 .08em;color:inherit;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.prose{max-width:70ch}
.prose p+p{margin-top:10px}
.sec{margin-top:56px}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.sec-head p{color:var(--muted);max-width:60ch;margin-top:6px}
.page-head{display:grid;gap:12px;margin-bottom:28px}

/* ---------- Nút chung ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;border:1.5px solid transparent;font:600 15px/1.2 var(--f-body);text-decoration:none;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.btn-pri{background:var(--accent);color:var(--accent-ink)}
.btn-pri:hover{background:var(--accent-hover);color:var(--accent-ink)}
.btn-sec{background:var(--surface);color:var(--ink);border-color:var(--line-strong)}
.btn-sec:hover{background:var(--surface-2);color:var(--ink)}
.btn-ghost{background:transparent;color:var(--accent);padding:0 10px}
.btn-ghost:hover{background:var(--accent-soft)}
.btn-sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:8px}
.btn-danger{color:var(--err)}
.btn[disabled],.btn[aria-disabled="true"]{cursor:not-allowed}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* ---------- Chip & nhãn ---------- */
.lv{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font:700 11.5px/1 var(--f-body);letter-spacing:.02em;white-space:nowrap}
.lv-m{background:var(--ink);color:var(--surface)}
.lv-s{background:var(--accent-soft);color:var(--accent)}
.lv-c{background:var(--surface-2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.rid{font:600 12.5px/1 var(--f-mono);color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:4px 6px;min-width:36px;text-align:center;display:inline-block}
.rchip{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);background:var(--mark-soft);border:1px solid color-mix(in srgb,var(--mark) 70%,var(--line));border-radius:6px;padding:1px 6px;font-size:.92em;vertical-align:baseline;line-height:1.5}
.rchip:hover{background:var(--mark);color:var(--mark-ink)}
.rchip-id{font:600 .86em var(--f-mono)}
.rchip-t{font-weight:500}
.tag{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;color:var(--ink-2);text-decoration:none;background:var(--surface);white-space:nowrap}
a.tag:hover{border-color:var(--line-strong);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font:600 12px var(--f-body)}
.pill-ok{background:var(--ok-soft);color:var(--ok)} .pill-err{background:var(--err-soft);color:var(--err)} .pill-warn{background:var(--warn-soft);color:var(--warn)} .pill-mute{background:var(--surface-2);color:var(--muted)}

/* ---------- Trang chủ ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:40px;align-items:center;padding-top:8px}
.hero-text{display:grid;gap:18px}
.hero-stats{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:14px}
.hero-stats b{color:var(--ink);font-family:var(--f-display);font-weight:800;font-size:18px;margin-right:4px}
@media (max-width:900px){.hero{grid-template-columns:minmax(0,1fr);gap:28px}}
.anat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 22px 18px;box-shadow:var(--shadow-2);position:relative}
.anat-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:16px}
.anat-top .pill{white-space:nowrap}
@media (max-width:420px){.anat-top .pill{display:none}}
.anat-top .eyebrow{display:flex;align-items:center;gap:8px}
.anat-field{position:relative;padding-left:34px}
.anat-field .f-field{margin-bottom:6px}
.anat-pin{position:absolute;left:0;width:22px;height:22px;border-radius:50%;background:var(--mark);color:var(--mark-ink);font:700 12px/22px var(--f-mono);text-align:center;box-shadow:0 0 0 3px var(--surface)}
.anat-legend{list-style:none;margin:16px 0 0;padding:14px 0 0;border-top:1px dashed var(--line);display:grid;gap:8px;font-size:13.5px}
.anat-legend li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:start}
.anat-legend .anat-pin{position:static;box-shadow:none}
.anat-try{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.try-chip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 10px;border-radius:8px;border:1px dashed var(--line-strong);background:var(--bg);color:var(--ink-2);font:500 13px var(--f-body);cursor:pointer}
.try-chip code{background:none;border:0;padding:0;font-size:12.5px}
.try-chip:hover{border-style:solid;color:var(--ink)}
.golden{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px;counter-reset:g}
.golden a{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;padding:16px 4px;border-top:1px solid var(--line);text-decoration:none;color:var(--ink)}
.golden a:hover .g-t{color:var(--accent)}
.golden .rid{grid-row:span 2;align-self:start;margin-top:2px}
.g-t{font-weight:700;font-size:16px}
.g-s{color:var(--muted);font-size:14px}
@media (max-width:760px){.golden{grid-template-columns:minmax(0,1fr)}}
.journey{position:relative;display:grid;grid-template-columns:repeat(7,minmax(138px,1fr));gap:0;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x proximity}
.j-step{position:relative;padding:0 14px 0 0;scroll-snap-align:start}
.j-num{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.j-num b{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--surface);font:700 13px var(--f-mono);flex:none}
.j-num::after{content:"";flex:1;height:2px;background:var(--line)}
.j-step:last-child .j-num::after{display:none}
.j-n{font-weight:700;font-size:15px}
.j-d{color:var(--muted);font-size:13.5px;margin:4px 0 8px}
.j-f{font-size:13px;color:var(--ink-2);background:var(--mark-soft);border-radius:8px;padding:6px 9px;margin-bottom:8px;font-style:italic}
.tasks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.task{display:flex;flex-direction:column;gap:8px;padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-decoration:none;color:var(--ink);transition:border-color .15s,transform .15s}
.task:hover{border-color:var(--accent);color:var(--ink);transform:translateY(-2px)}
.task .ic{color:var(--accent)}
.task-t{font-weight:700;font-size:16px}
.task-s{color:var(--muted);font-size:14px}
.task-go{font-weight:600;font-size:14px;color:var(--accent);display:flex;align-items:center;gap:4px;margin-top:auto;padding-top:4px}
@media (max-width:1180px){.tasks{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.tasks{grid-template-columns:minmax(0,1fr)}}
.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.level{padding:16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;gap:8px;align-content:start}
.level-n{display:flex;align-items:center;justify-content:space-between;gap:8px}
.level-n b{font:800 22px var(--f-display)}
@media (max-width:700px){.levels{grid-template-columns:minmax(0,1fr)}}
.sources{columns:2;column-gap:28px;padding-left:18px;font-size:14px;color:var(--ink-2)}
.sources li{margin-bottom:6px;break-inside:avoid}
@media (max-width:700px){.sources{columns:1}}
.footnote{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between}

/* ---------- Danh sách nguyên tắc ---------- */
.filters{grid-template-columns:minmax(0,1fr);position:sticky;top:calc(var(--hdr) + env(safe-area-inset-top,0px));z-index:5;background:var(--bg);padding:12px 0;margin:0 0 8px;border-bottom:1px solid var(--line);display:grid;gap:10px}
@media (max-width:1079px){.filters{top:calc(var(--hdr) + 44px + env(safe-area-inset-top,0px))}}
.filter-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search-in{position:relative;flex:1 1 280px;min-width:0}
.search-in .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search-in input{width:100%;height:44px;padding:0 40px 0 40px;border:1.5px solid var(--line-strong);border-radius:10px;background:var(--field);color:var(--ink);font:16px var(--f-body)}
.search-in input:focus{outline:3px solid var(--ring);outline-offset:0;border-color:var(--accent)}
.search-in .clear{position:absolute;right:4px;top:50%;transform:translateY(-50%)}
.seg{position:relative;display:inline-flex;border:1.5px solid var(--line-strong);border-radius:10px;overflow:hidden;background:var(--surface);flex-wrap:nowrap;max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;min-height:40px;padding:0 12px;cursor:pointer;font-weight:600;font-size:14px;color:var(--ink-2);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg button .n{font:600 11.5px var(--f-mono);opacity:.75}

.mk-success{display:flex;align-items:center;gap:8px;color:var(--ok);font-size:15px}

.mk-code{font:700 18px var(--f-mono)}
.mk-pill{width:fit-content;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.mk-path .mk-f{position:relative}
