<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng ký Cuộc thi Ý tưởng Xanh 2026 (ví dụ nhiều bước)</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f4f6f8; color: #1d2433; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 22px; margin: 6px 0 4px; }
  .steps { font-size: 14px; color: #5b6475; margin-bottom: 18px; }
  .card { background: #fff; border-radius: 10px; padding: 18px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .row { margin-bottom: 16px; }
  label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
  input, select, textarea { width: 100%; box-sizing: border-box; font-size: 14px; padding: 9px 10px; border: 1px solid #d5dae1; border-radius: 6px; background: #fff; }
  .err { color: #e02424; font-size: 13px; margin-top: 4px; }
  .bad { border-color: #e02424; }
  .btns { display: flex; gap: 10px; justify-content: space-between; margin-top: 8px; }
  button { font-size: 15px; padding: 11px 18px; border-radius: 6px; border: 0; background: #1f6feb; color: #fff; }
  button.sec { background: #e8ebf0; color: #1d2433; }
  .check label { font-weight: 400; display: flex; gap: 8px; align-items: flex-start; }
  .check input { width: auto; margin-top: 3px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Đăng ký Cuộc thi Ý tưởng Xanh 2026</h1>
  <div class="steps" id="ind">Bước 1/3 · Thông tin thí sinh</div>
  <form class="card" id="f" novalidate>
    <section data-step="1">
      <div class="row"><label for="hoten">Họ và tên *</label><input id="hoten" name="hoten" autocomplete="name" required></div>
      <div class="row"><label for="ngaysinh">Ngày sinh *</label><input id="ngaysinh" name="ngaysinh" type="date" required></div>
      <div class="row"><label for="gioitinh">Giới tính *</label><select id="gioitinh" name="gioitinh" required><option value="">-- Chọn --</option><option>Nam</option><option>Nữ</option><option>Khác</option></select></div>
      <div class="row"><label for="cccd">Số CCCD *</label><input id="cccd" name="cccd" type="number" required></div>
    </section>
    <section data-step="2" hidden>
      <div class="row"><label for="email">Email *</label><input id="email" name="email" type="email" required></div>
      <div class="row"><label for="sdt">SĐT *</label><input id="sdt" name="sdt" type="text" maxlength="10" required></div>
      <div class="row"><label for="tinh">Tỉnh/Thành phố *</label><select id="tinh" name="tinh" required><option value="">-- Chọn tỉnh --</option><option>Hà Nội</option><option>Hà Giang</option><option>Bình Dương</option><option>Quảng Nam</option><option>TP. Hồ Chí Minh</option></select></div>
      <div class="row"><label for="huyen">Quận/Huyện *</label><input id="huyen" name="huyen" required></div>
    </section>
    <section data-step="3" hidden>
      <div class="row"><label for="tenyt">Tên ý tưởng *</label><input id="tenyt" name="tenyt" required></div>
      <div class="row"><label for="mota">Mô tả ý tưởng *</label><textarea id="mota" name="mota" rows="5" maxlength="500" required></textarea></div>
      <div class="row"><label for="tep">Tệp bài dự thi *</label><input id="tep" name="tep" type="file" required></div>
      <div class="row check"><label><input type="checkbox" name="dongy" required> Tôi đồng ý với điều khoản và muốn nhận tin khuyến mãi từ đối tác</label></div>
    </section>
    <div class="btns">
      <button type="button" class="sec" id="back" hidden>Quay lại</button>
      <button type="button" id="next">Tiếp tục</button>
      <button type="submit" id="send" hidden>Gửi hồ sơ</button>
    </div>
  </form>
  <section class="card" id="done" hidden>
    <h2>Đăng ký thành công</h2>
    <p>Mã hồ sơ: <b id="code"></b></p>
    <p>Chúng tôi đã gửi email xác nhận tới <span id="em"></span>.</p>
    <p>Số điện thoại liên hệ: <span id="ph"></span></p>
    <p>Bước tiếp theo: 15/12/2026 công bố danh sách vào vòng 2.</p>
  </section>
</div>
<script>
(function () {
  var step = 1, names = { 1: 'Thông tin thí sinh', 2: 'Liên hệ', 3: 'Bài dự thi' };
  var f = document.getElementById('f');
  function sec(n) { return f.querySelector('[data-step="' + n + '"]'); }
  function show() {
    [1, 2, 3].forEach(function (n) { sec(n).hidden = n !== step; });
    document.getElementById('ind').textContent = 'Bước ' + step + '/3 · ' + names[step];
    document.getElementById('back').hidden = step === 1;
    document.getElementById('next').hidden = step === 3;
    document.getElementById('send').hidden = step !== 3;
    window.scrollTo(0, 0);
  }
  function valid(n) {
    var ok = true;
    sec(n).querySelectorAll('[required]').forEach(function (el) {
      var row = el.closest('.row'), old = row.querySelector('.err');
      if (old) old.remove();
      el.classList.remove('bad');
      var empty = el.type === 'checkbox' ? !el.checked : el.type === 'file' ? !el.files.length : !el.value.trim();
      if (empty) { ok = false; el.classList.add('bad'); var p = document.createElement('div'); p.className = 'err'; p.textContent = 'Trường này là bắt buộc'; row.appendChild(p); }
    });
    return ok;
  }
  document.getElementById('next').addEventListener('click', function () { if (valid(step)) { step++; show(); } });
  document.getElementById('back').addEventListener('click', function () { step--; show(); });
  f.addEventListener('submit', function (e) {
    e.preventDefault();
    if (!valid(3)) return;
    var btn = document.getElementById('send'); btn.disabled = true; btn.textContent = 'Đang gửi…';
    fetch('/api/vi-du-nhan-ho-so', { method: 'POST', body: new FormData(f) }).then(function (r) { return r.json(); }).then(function (j) {
      if (!j.ok) throw new Error(j.error);
      f.hidden = true; document.getElementById('ind').hidden = true;
      document.getElementById('code').textContent = j.code;
      document.getElementById('em').textContent = f.email.value;
      document.getElementById('ph').textContent = f.sdt.value;
      document.getElementById('done').hidden = false; window.scrollTo(0, 0);
    }).catch(function () { btn.disabled = false; btn.textContent = 'Gửi hồ sơ'; alert('Có lỗi xảy ra'); });
  });
})();
</script>
</body>
</html>
